<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - College Book Exchange</title>
    <link rel="shortcut icon" type="image/x-icon" href="book-stack.ico" />
    <link rel="stylesheet" href="buy.css"> <!-- Link to external CSS -->
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html"><img src="logo.jpg" alt="Logo" /></a> <!-- Logo on the left -->
        </div>
        <div class="login-btn">
            <a href="sell.html">Login as Seller</a> <!-- Login button on the right -->
        </div>
    </nav>

    <header>
        <h1>Search Results</h1>
    </header>

    <!-- Container for the book list -->
    <div class="container">
        <!-- List of Search Results -->
        <div class="book-list" id="bookList"></div>
    </div>

    <script type="module">
        // Import Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCvIFoJYP6itYcz2kIOmJVlHN0qUazjLbk",
            authDomain: "pustakvillla.firebaseapp.com",
            projectId: "pustakvillla",
            storageBucket: "pustakvillla.appspot.com",
            messagingSenderId: "851247961324",
            appId: "1:851247961324:web:30bf7cedc0809cd21281c9"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const bookList = document.getElementById("bookList");

        // Get search query from URL
        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('query').toLowerCase();

        // Display search results based on partial matches
        async function displaySearchResults() {
            const booksCollection = collection(db, "books");
            const bookSnapshot = await getDocs(booksCollection);
            const searchResults = bookSnapshot.docs
                .map(doc => doc.data())
                .filter(book => book.title.toLowerCase().includes(searchQuery));

            searchResults.forEach(book => {
                const bookItem = document.createElement("div");
                bookItem.className = "book-item";
                bookItem.innerHTML = `
                    <div class="book-image">
                        <img src="${book.imageURL}" alt="${book.title} book cover">
                    </div>
                    <div class="book-info">
                        <h3>${book.title}</h3>
                        <p><strong>Author:</strong> ${book.author}</p>
                        <p><strong>Price:</strong> ₹${book.price}</p>
                        <a href="https://wa.me/${book.contact}" class="whatsapp-link">Contact via WhatsApp</a>
                        <p class="description">${book.description}</p>
                    </div>
                `;
                bookList.appendChild(bookItem);
            });
        }

        // Call the function to display search results on page load
        window.onload = displaySearchResults;
    </script>
</body>
</html>
